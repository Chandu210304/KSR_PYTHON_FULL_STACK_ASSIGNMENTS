<!DOCTYPE html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form action="#" method="post">
        
        <p>
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </p>

        <p>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="example@domain.com" required></p>

        <p>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Create a password" required></p>

        <p>
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 20" required></p>

        <p>
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required></p>

        <p>
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label></p>

        <p>
        <label>Skills:</label><br>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills" value="javascript">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="python" name="skills" value="python">
        <label for="python">Python</label></p>

        <p>
        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ds">Data Science</option>
            <option value="ai">Artificial Intelligence</option>
        </select></p>

        <p>
        <label for="profile_pic">Profile Picture:</label><br>
        <input type="file" id="profile_pic" name="profile_pic" accept="image"></p>

        <p>
        <label for="about">About Yourself:</label><br>
        <textarea id="about" name="about" rows="5" cols="40" placeholder="Write  about yourself..."></textarea></p>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
